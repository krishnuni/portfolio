name: Verify and deploy portfolio
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build and verify production artifact
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ vars.SITE_URL || 'https://vai.is-a.dev/' }}
      - name: Install browser for verification
        run: npx playwright install --with-deps chromium
      - name: Verify production browser flows
        run: npm run test:browser
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-evidence
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Upload static site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy portfolio
        id: deployment
        uses: actions/deploy-pages@v4
